version: 2.1
alias:
  - &docker-login echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

jobs:
  build:
    docker:
      - image: okteto/golang-ci:2.10.1@sha256:3279c526fdce2272b60979dff352e1e672bf2f8d3035797d96365c619f9c87ab
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    steps:
      - checkout
      - run: 
          name: Build Rootful Image
          command: make build-rootful
      - run: 
          name: Build Rootless Image
          command: make build-rootless
  release:
    docker:
      - image: okteto/golang-ci:2.10.1@sha256:3279c526fdce2272b60979dff352e1e672bf2f8d3035797d96365c619f9c87ab
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    steps:
      - checkout
      - run: *docker-login
      - run:
          name: Build and Push Rootful Image
          command: make push-rootful
      - run:
          name: Build and Push Rootless Image
          command: make push-rootless

workflows:
  version: 2
  build:
    jobs:
      - build:
          context: dockerhub
  release:
    jobs:
      - release:
          context: dockerhub
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+$/
